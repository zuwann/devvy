<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

main{max-width:1150px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:.2em 0 .4em}
p{margin:.4em 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}

.card.okc{--cc:var(--ok)}

.card.warn>b:first-child,.card.err>b:first-child,.card.okc>b:first-child,.card.warn>h3:first-child,.card.err>h3:first-child,.card.okc>h3:first-child{display:inline-block;color:var(--cc);margin-bottom:.15em}

.b.sec,.b.ok,.b.wb{background:var(--warn);color:#1a1300;border:0}
.b.red{background:var(--err);color:#fff}
a.b,a.b:visited{color:var(--accfg);text-decoration:none;display:inline-block}a.b.sec,a.b.sec:visited,a.b.ok,a.b.ok:visited,a.b.wb,a.b.wb:visited{color:#1a1300}a.b.red,a.b.red:visited{color:#fff}

button.b.small{min-height:32px}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
button.b:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=text],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:.82rem;font-weight:600;position:sticky;top:0;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinrow.c{display:flex;justify-content:center;align-items:center;padding:48px 0}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}

tr.del td{background:rgba(180,35,24,.20)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mut);vertical-align:middle}.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--err)}
.grplab{font-size:.78rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.bd{white-space:nowrap;display:inline-block;margin-top:4px}.bd.g b{color:var(--ok)}.bd.y b{color:var(--warn)}.bd.r b{color:var(--err)}

.filt{padding:14px 16px}.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.fgrid label.fl{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}.fgrid input,.fgrid select{width:100%}
.fchecks{margin-top:12px;display:flex;flex-direction:column;gap:2px}

code{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;word-break:break-all}
.tag{display:inline-block;font-size:.85rem;font-weight:700;color:var(--mut);margin-left:6px}
.tag.r{color:var(--err)}.tag.g{color:var(--ok)}.tag.y{color:var(--warn)}

label.chk.part .tag{margin-left:12px;white-space:nowrap}
label.chk.part:has(input:checked){border-color:var(--acc);background:rgba(80,130,255,.08)}
label.chk.part:has(input:disabled){opacity:.6;cursor:default}
.st.INFO{color:var(--mut)}
.gear{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px!important}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.belln{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

.gear{position:relative}

.st{font-weight:700;white-space:nowrap}.st.OK{color:var(--ok)}.st.WARN{color:var(--warn)}.st.ERROR{color:var(--err)}

.prog{display:flex;gap:10px;align-items:center;padding:12px 18px}
.pbar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}

#popbody .card{background:var(--bg)}
#popbody{padding:14px 18px;overflow:auto;flex:1}
#modal{z-index:100;display:flex}
.dhead{display:flex;gap:10px;align-items:center;padding:14px 18px;min-height:56px;box-sizing:border-box;border-bottom:1px solid var(--line)}

nav button.off{opacity:.45}
nav button.lock{opacity:.45}

#top svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.closing{max-width:480px;margin:12vh auto;text-align:center}
.cbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:16px 0 8px}

.cfd{width:min(520px,100%)}
.cbody{padding:16px 18px;line-height:1.5;white-space:pre-line}

.hlp{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:.8rem;font-weight:700;cursor:pointer;vertical-align:middle;padding:0}
.hlp:hover,.hlp:focus-visible{color:var(--fg);border-color:var(--fg)}
.term{margin:12px 0 0;border:1px solid #6b6b6b;background:#0c0c0c;box-shadow:0 6px 18px rgba(0,0,0,.4);border-radius:0}

.termbar .ico{width:16px;height:16px;background:#0c0c0c;border:1px solid #777;box-sizing:border-box;color:#ddd;font:700 8px/14px Consolas,monospace;text-align:center}
.termbar .wc{display:flex}

.termbody{margin:0;padding:6px 8px;color:#cccccc;background:#0c0c0c;font:13px/1.45 Consolas,'Cascadia Mono','Courier New',monospace;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.termbody .pr{color:#e5e5e5}.termbody .cm{color:#f9f1a5}
.termbody .cur{display:inline-block;width:.6em;height:2px;background:#ccc;vertical-align:baseline;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px}
#cfopts{flex-direction:column;flex-wrap:nowrap!important;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#cfopts .b{width:100%;white-space:normal;text-align:left;line-height:1.35;min-height:40px}
.thb{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:700;color:var(--acc);cursor:pointer;text-align:left;white-space:nowrap}
.thb:hover{text-decoration:underline;text-underline-offset:3px}
th:has(>.thb),table.sortable th[data-ns],th.nsh{background:color-mix(in srgb,var(--acc) 12%,var(--bg))}
.thb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.xbtn{width:34px;height:34px;border-radius:50%;border:0;padding:0;background:transparent;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}

.xbtn:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.xbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:70px auto}

.stars{display:inline-flex;gap:2px;vertical-align:middle}.hlh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hls{font-size:1.4rem;font-weight:700}.hls.OK{color:var(--ok)}.hls.WARN{color:var(--warn)}.hls.ERROR{color:var(--err)}
.flows{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.flow{margin:0;display:flex;flex-direction:column}
.flow .row{margin-top:auto;padding-top:10px}
.flow h3{margin-top:0}
</style>

  if(d.f){ var Fz=S.filter[S.tab]; Fz.sel=Fz.sel||{}; Fz.sel[d.f]=t0.value; go(S.tab); return; }
  if(t0.id==='grp'){ S.filter.drivers.ext=t0.checked; go('drivers'); return; }
  if(t0.id==='inuse'){ S.filter.drivers.inuse=t0.checked; go('drivers'); return; }
  if(t0.id==='only'){ S.filter[S.tab].only=t0.checked; go(S.tab); return; }
  if(t0.id==='proffile'){ var fl=t0.files&&t0.files[0]; if(!fl) return; var rd=new FileReader(); rd.onload=function(){ var pr; try{ pr=JSON.parse(String(rd.result).replace(/^\uFEFF/,'')); }catch(x){ notice(t('This is not a Devvy profile file.'),true); return; } ask({title:t('Import profile'),text:t('Import this profile? Its exclusions, knowledge rows and support pages are added to yours; nothing of yours is deleted.'),ok:t('Import profile'),cancel:t('Cancel')}).then(function(y){ if(!y) return; api('/api/profile',{profile:pr}).then(function(r){ return loadState().then(function(){ notice(t('Profile imported: {0} exclusion(s) in total, {1} knowledge row(s) and {2} support page(s) added.',r.exclusions,r.knowledgeAdded,r.supportAdded)+((r.invalid&&r.invalid.length)?' '+t('Skipped as invalid: {0}.',r.invalid.join(', ')):'')); }); }).catch(function(x){ notice(x.message,true); }); }); }; rd.readAsText(fl); t0.value=''; return; }
  if(t0.id==='consent'){ $('#bsearch').disabled=!t0.checked; api('/api/settings',{catalogConsent:t0.checked}).then(function(){ return loadState(); }); return; }
  if(d.cat!==undefined){ S.cat[d.cat]={updateId:t0.value,risk:false}; vUpdates(); return; }
  if(d.risk!==undefined){ var c=S.cat[d.risk]; if(c) c.risk=t0.checked; return; }
  if(d.part){ S.run.parts[d.part]=t0.checked; updateGo(); return; }
  if(t0.name==='mode'){ S.run.apply=(t0.value==='app'); vRun(); return; }
  if(t0.name==='bk'){ S.run.backup=t0.value; S.run.bkTouched=true; updateGo(); return; }
});
document.addEventListener('input',function(e){
  var t0=e.target;
  if(t0.id==='q'){ S.filter[S.tab].q=t0.value; clearTimeout(S.qt); var pos=t0.selectionStart; S.qt=setTimeout(function(){ vTable(S.tab).then(function(){ var q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } }); },300); }
});

window.addEventListener('scroll',function(){ var b=$('#top'); if(b) b.classList.toggle('show',window.scrollY>120); },{passive:true});
document.addEventListener('click',function(e){ if(e.target&&e.target.closest&&e.target.closest('#top')){ window.scrollTo({top:0,behavior:'smooth'}); } });
function startUpdateCheck(){
  var st=S.state&&S.state.settings; if(S.updDone||!st||!st.firstRunDone||st.updateCheck===false) return Promise.resolve(false); S.updDone=true;
  var chk=netGate(NETUPD,true).then(function(ok){ return ok?api('/api/update/check'):null; }), to=new Promise(function(res){ setTimeout(function(){ res(null); },25000); });
  return Promise.race([chk,to]).then(function(r){
    if(!r||!r.ok||!r.needed) return false;
    S.upd=r; var ub=$('#updbadge'); if(ub){ ub.style.display=''; ub.textContent='!'; } refreshBell();
    // nothing else runs until the person decides: update now (download, install, restart) or go on with this version
    return ask({title:t('New version available'),text:t('Devvy {0} is available (you have {1}). Devvy waits for your answer before doing anything else: update now (it downloads, installs and restarts) or go on with this version.',r.latest,r.current),ok:t('Update now'),cancel:t('Not now')}).then(function(y){
      if(y){ launch({action:'selfupdate'}); return true; }
      return false;
    });
  }).catch(function(){ return false; }).then(function(started){ return started?true:startKbCheck(); });
}
// A newer knowledge base (kb/manifest.json on GitHub) is offered like a program update, even when Devvy itself has no new version.
function startKbCheck(){
  var kc=netGate(NETUPD,true).then(function(ok){ return ok?api('/api/kb/check'):null; }), to2=new Promise(function(res){ setTimeout(function(){ res(null); },20000); });
  return Promise.race([kc,to2]).then(function(r){
    if(!r||!r.ok||!r.needed) return false;
    S.kb=r; var ub=$('#updbadge'); if(ub){ ub.style.display=''; ub.textContent='!'; } refreshBell();
    return ask({title:t('Knowledge base update available'),text:t('A newer knowledge base is available (version {0}, you have {1}). It only updates the list that explains the components: Devvy itself is not changed and does not restart. Update it now?',r.latest,r.current),ok:t('Update knowledge base'),cancel:t('Not now')}).then(function(y){
      if(y){ S.kbNow=true; S.kb=null; refreshBell(); }
      return false;
    });
  }).catch(function(){ return false; });
}
Promise.all([loadI18n(),loadState()]).then(function(){
  try{ var sv=sessionStorage.getItem('dp_saved'); if(sv){ sessionStorage.removeItem('dp_saved'); notice(sv); } }catch(x){}
  drawTabs(); go('start');
  return api('/api/job');
}).then(function(j){
  if(j.status==='running'){ S.open=true; S.polling=setInterval(pollJob,1000); pollJob(); return; }
  S.postWork=!!(S.state.postReboot&&S.state.settings.firstRunDone);
  return (S.postWork?Promise.resolve(false):startUpdateCheck()).then(function(started){
  if(started) return;
  var st=S.state.settings;
  if(!S.autoDone && st.firstRunDone){
    var q=[]; if(S.kbNow){ S.kbNow=false; q.push('kbupdate'); } q.push('selftest'); S.cont=(S.state.postReboot&&S.state.cont&&S.state.cont.parts&&S.state.cont.parts.length)?S.state.cont:null; if(st.inventoryAtStart||!hasInv()||S.cont) q.push('inventory'); if(S.state.postReboot) q.push('postcheck');
    if(q.length){ S.autoDone=true; S.queue=q.slice(1); launch({action:q[0]},6); }
  }
  });
}).catch(function(e){ $('#main').innerHTML='<div class="card err">'+esc(e.message)+'</div>'; });
